services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - library-postgres-data:/var/lib/postgresql

volumes:
  library-postgres-data:
