<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Library Management System architecture</title>
  <desc id="description">Clients and AI agents enter through secured REST and MCP adapters, which reuse the same application services, persistence layer, events, and PostgreSQL or H2 database. Metadata enrichment integrates with Open Library.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="security" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font: 700 34px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .section { font: 700 14px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 1.4px; fill: #64748b; }
      .card-title { font: 700 19px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .card-text { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .card-small { font: 600 13px Inter, "Segoe UI", Arial, sans-serif; fill: #334155; }
      .security-title { font: 700 18px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .security-text { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #e0e7ff; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .connector { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>

  <text x="60" y="58" class="heading">Library Management System</text>
  <text x="60" y="86" class="subtitle">Spring Boot 4 · Java 25 · one secured domain model exposed through REST and MCP</text>

  <text x="60" y="125" class="section">CONSUMERS AND EXTERNAL SYSTEMS</text>

  <g filter="url(#shadow)">
    <rect x="60" y="145" width="345" height="94" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
    <circle cx="94" cy="178" r="14" fill="#2563eb"/>
    <path d="M88 178h12M94 172v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="122" y="180" class="card-title">REST consumers</text>
    <text x="82" y="211" class="card-text">Postman · Swagger UI · browser · HTTP clients</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="548" y="145" width="345" height="94" rx="14" fill="#ffffff" stroke="#c4b5fd"/>
    <circle cx="582" cy="178" r="14" fill="#7c3aed"/>
    <path d="M576 175h12M576 181h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="610" y="180" class="card-title">AI agents</text>
    <text x="570" y="211" class="card-text">MCP clients · MCP Inspector · agent runtimes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1036" y="145" width="345" height="94" rx="14" fill="#ffffff" stroke="#99f6e4"/>
    <circle cx="1070" cy="178" r="14" fill="#0f766e"/>
    <path d="M1063 178h14M1070 171c4 4 4 10 0 14M1070 171c-4 4-4 10 0 14" stroke="#fff" stroke-width="1.7" fill="none"/>
    <text x="1098" y="180" class="card-title">Open Library</text>
    <text x="1058" y="211" class="card-text">External ISBN metadata provider</text>
  </g>

  <path class="arrow" d="M232 239 V316"/>
  <path class="arrow" d="M720 239 V316"/>
  <path class="arrow-dashed" d="M1208 239 V465"/>

  <rect x="40" y="265" width="1360" height="600" rx="22" fill="#ffffff" fill-opacity="0.68" stroke="#cbd5e1" stroke-width="2"/>
  <text x="66" y="298" class="section">SPRING BOOT APPLICATION</text>

  <g filter="url(#shadow)">
    <rect x="80" y="316" width="835" height="72" rx="14" fill="url(#security)"/>
    <text x="110" y="347" class="security-title">Spring Security authorization boundary</text>
    <text x="110" y="372" class="security-text">HTTP Basic authentication · CLIENT / OWNER roles · method-level authorization · ownership checks</text>
  </g>

  <path class="arrow" d="M450 388 V423"/>
  <path class="arrow" d="M895 388 V423"/>

  <text x="80" y="417" class="section">TRANSPORT AND INTEGRATION ADAPTERS</text>

  <g filter="url(#shadow)">
    <rect x="80" y="435" width="390" height="112" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="104" y="469" class="card-title">REST API</text>
    <text x="104" y="496" class="card-text">8 controllers · 25 documented operations</text>
    <text x="104" y="521" class="card-small">Validation · pagination · RFC 9457 errors</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="525" y="435" width="390" height="112" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="549" y="469" class="card-title">MCP server</text>
    <text x="549" y="496" class="card-text">Streamable HTTP at /mcp · 21 tools</text>
    <text x="549" y="521" class="card-small">Generated schemas · role-aware tool calls</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="435" width="390" height="112" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="994" y="469" class="card-title">Metadata adapter</text>
    <text x="994" y="496" class="card-text">Bounded HTTP timeouts · ISBN lookup</text>
    <text x="994" y="521" class="card-small">Normalization · concurrency recheck</text>
  </g>

  <path class="connector" d="M275 547 V585 M720 547 V585 M1165 547 V585 M275 585 H1165"/>
  <path class="arrow" d="M275 585 V592"/>
  <path class="arrow" d="M720 585 V592"/>
  <path class="arrow" d="M1165 585 V592"/>

  <text x="80" y="579" class="section">APPLICATION AND DOMAIN SERVICES</text>

  <g filter="url(#shadow)">
    <rect x="80" y="596" width="390" height="112" rx="14" fill="#ffffff" stroke="#94a3b8"/>
    <text x="104" y="630" class="card-title">Core workflows</text>
    <text x="104" y="657" class="card-text">Inventory · loans · returns · late fees</text>
    <text x="104" y="682" class="card-small">FIFO reservations · transactional locking</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="525" y="596" width="390" height="112" rx="14" fill="#ffffff" stroke="#94a3b8"/>
    <text x="549" y="630" class="card-title">Discovery and assistant</text>
    <text x="549" y="657" class="card-text">Natural-language search · recommendations</text>
    <text x="549" y="682" class="card-small">Read-only grounded chat orchestration</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="596" width="390" height="112" rx="14" fill="#ffffff" stroke="#94a3b8"/>
    <text x="994" y="630" class="card-title">Metadata and lifecycle operations</text>
    <text x="994" y="657" class="card-text">ISBN snapshots · domain events · scheduling</text>
    <text x="994" y="682" class="card-small">Concurrency recheck · expiry reconciliation</text>
  </g>

  <path class="connector" d="M275 708 V723 M720 708 V723 M1165 708 V723 M275 723 H1165"/>
  <path class="arrow" d="M385 723 V750"/>

  <text x="80" y="740" class="section">PERSISTENCE</text>

  <g filter="url(#shadow)">
    <rect x="80" y="757" width="610" height="76" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="104" y="789" class="card-title">Spring Data JPA + Flyway</text>
    <text x="104" y="813" class="card-text">Repositories · versioned migrations · schema validation · pessimistic locks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="757" width="610" height="76" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="774" y="789" class="security-title">PostgreSQL 18 / H2</text>
    <text x="774" y="813" class="security-text">Production-like Docker profile / zero-setup development and tests</text>
  </g>

  <path class="arrow" d="M690 795 H750"/>
</svg>
